{% extends "mobile/base_mobile.html" %}
{% block title %}Reports – Mobile{% endblock %}
{% block header_title %}Reports{% endblock %}

{% block content %}
<div class="list-group shadow-sm">
    <a href="{% url 'reports:sales' %}" class="list-group-item list-group-item-action d-flex align-items-center py-3">
        <i class="bi bi-currency-rupee fs-3 me-3 text-primary"></i>
        <div>
            <div class="fw-semibold">Sales Report</div>
            <small class="text-muted">Revenue & top products</small>
        </div>
    </a>
    <a href="{% url 'reports:inventory' %}" class="list-group-item list-group-item-action d-flex align-items-center py-3">
        <i class="bi bi-box-seam fs-3 me-3 text-success"></i>
        <div>
            <div class="fw-semibold">Inventory Report</div>
            <small class="text-muted">Stock & low stock alerts</small>
        </div>
    </a>
    <a href="{% url 'reports:profit' %}" class="list-group-item list-group-item-action d-flex align-items-center py-3">
        <i class="bi bi-pie-chart fs-3 me-3 text-warning"></i>
        <div>
            <div class="fw-semibold">Profit Report</div>
            <small class="text-muted">Revenue, COGS & margin</small>
        </div>
    </a>
</div>
{% endblock %}
