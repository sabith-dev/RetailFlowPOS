{% extends "base.html" %}
{% block title %}Deactivate Product{% endblock %}

{% block content %}
<div class="container">
    <div class="card shadow-sm border-danger mx-auto" style="max-width: 500px;">
        <div class="card-body text-center p-4">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
            <h4 class="mt-3">Deactivate Product?</h4>
            <p class="text-muted">
                Are you sure you want to deactivate<br>
                <strong>{{ product.name }}</strong> ({{ product.sku }})?
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Deactivate</button>
                <a href="{% url 'products:list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
